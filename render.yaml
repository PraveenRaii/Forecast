services:
  - type: web
    name: safar-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATA_MODE
        value: demo
      - key: FRONTEND_URL
        value: https://safar-forecast.onrender.com

  - type: web
    name: safar-forecast
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://safar-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
